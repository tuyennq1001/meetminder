<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Meet Minder meeting management and search</title>
  <desc id="desc">Illustration of customer, project, category, and tag management alongside searchable meeting archive filters for work and personal meetings.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171923"/>
      <stop offset="1" stop-color="#101116"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bd8cff"/>
      <stop offset="1" stop-color="#8c63db"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".3"/>
    </filter>
    <style>
      .ui { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .muted { fill: #a4a7b4; }
      .white { fill: #f4f1fa; }
      .small { font-size: 15px; }
      .tiny { font-size: 13px; }
      .label { font-size: 14px; font-weight: 650; letter-spacing: .3px; }
      .panel { fill: #1b1d26; stroke: #343644; stroke-width: 1.3; }
      .field { fill: #14161d; stroke: #3b3d4a; stroke-width: 1; }
      .line { stroke: #343642; stroke-width: 1; }
    </style>
  </defs>
  <rect width="1440" height="760" rx="28" fill="url(#bg)"/>
  <circle cx="1330" cy="60" r="190" fill="#8d63d9" opacity=".08"/>
  <circle cx="95" cy="690" r="230" fill="#6b79e8" opacity=".055"/>
  <text class="ui" x="72" y="66" fill="#c59aff" font-size="14" font-weight="700" letter-spacing="2.2">MEET MINDER  /  MEETING WORKSPACE</text>
  <text class="ui white" x="72" y="112" font-size="31" font-weight="720">Keep every meeting easy to find</text>
  <text class="ui muted" x="72" y="143" font-size="17">Organize your people, projects, and notes in one local-first archive.</text>

  <!-- Management panel -->
  <g filter="url(#shadow)">
    <rect class="panel" x="64" y="184" width="492" height="510" rx="20"/>
  </g>
  <rect x="64" y="184" width="492" height="56" rx="20" fill="#22242e"/>
  <path d="M64 220h492" class="line"/>
  <circle cx="91" cy="212" r="8" fill="#bd8cff"/>
  <text class="ui white" x="111" y="218" font-size="16" font-weight="700">Data management</text>
  <text class="ui muted tiny" x="513" y="217" text-anchor="end">SETTINGS</text>

  <text class="ui muted tiny" x="91" y="273" font-weight="700" letter-spacing="1">CUSTOMERS</text>
  <rect class="field" x="88" y="288" width="444" height="54" rx="11"/>
  <circle cx="113" cy="315" r="11" fill="#44364f"/><text class="ui" x="113" y="320" text-anchor="middle" fill="#e7c8ff" font-size="13">N</text>
  <text class="ui white small" x="135" y="311" font-weight="650">Northstar Labs</text>
  <text class="ui muted tiny" x="135" y="329">Customer</text>
  <text class="ui muted" x="505" y="321" text-anchor="end" font-size="18">···</text>

  <text class="ui muted tiny" x="91" y="378" font-weight="700" letter-spacing="1">PROJECTS</text>
  <rect class="field" x="88" y="393" width="444" height="54" rx="11"/>
  <rect x="104" y="410" width="22" height="22" rx="6" fill="#203d4a"/><text x="115" y="426" text-anchor="middle" fill="#8bd6ec" font-size="13">◆</text>
  <text class="ui white small" x="139" y="416" font-weight="650">Atlas Mobile</text>
  <text class="ui muted tiny" x="139" y="434">Northstar Labs · Work</text>
  <text class="ui muted" x="505" y="426" text-anchor="end" font-size="18">···</text>

  <text class="ui muted tiny" x="91" y="483" font-weight="700" letter-spacing="1">CATEGORIES &amp; TAGS</text>
  <rect x="88" y="498" width="444" height="72" rx="11" fill="#14161d" stroke="#3b3d4a"/>
  <rect x="105" y="513" width="118" height="27" rx="13.5" fill="#30273e" stroke="#675088"/>
  <text class="ui" x="164" y="531" text-anchor="middle" fill="#d7b9ff" font-size="12" font-weight="650">Product Review</text>
  <rect x="233" y="513" width="80" height="27" rx="13.5" fill="#202c3b" stroke="#435a78"/>
  <text class="ui" x="273" y="531" text-anchor="middle" fill="#b4d4ff" font-size="12" font-weight="650">#roadmap</text>
  <rect x="321" y="513" width="83" height="27" rx="13.5" fill="#21352f" stroke="#3d6957"/>
  <text class="ui" x="362" y="531" text-anchor="middle" fill="#a8e3c2" font-size="12" font-weight="650">#research</text>
  <text class="ui muted tiny" x="105" y="557">Create reusable categories and tags by scope</text>

  <rect x="88" y="596" width="444" height="66" rx="12" fill="#25212f" stroke="#55456b"/>
  <text class="ui" x="108" y="623" fill="#d2b4ff" font-size="13" font-weight="700">WORK  /  PERSONAL</text>
  <text class="ui muted small" x="108" y="645">Keep business and personal records separate.</text>
  <rect x="464" y="612" width="47" height="29" rx="14.5" fill="#3b2c50"/>
  <circle cx="496" cy="626.5" r="10" fill="#c9a1ff"/>

  <!-- Search panel -->
  <g filter="url(#shadow)">
    <rect class="panel" x="584" y="184" width="792" height="510" rx="20"/>
  </g>
  <rect x="584" y="184" width="792" height="56" rx="20" fill="#22242e"/>
  <path d="M584 220h792" class="line"/>
  <circle cx="612" cy="212" r="8" fill="#bd8cff"/>
  <text class="ui white" x="632" y="218" font-size="16" font-weight="700">Meeting archive</text>
  <text class="ui muted tiny" x="1338" y="217" text-anchor="end">12 MEETINGS</text>

  <rect class="field" x="610" y="260" width="480" height="48" rx="12"/>
  <circle cx="634" cy="283" r="7" fill="none" stroke="#b8bac5" stroke-width="2"/>
  <path d="m639 288 5 5" stroke="#b8bac5" stroke-width="2" stroke-linecap="round"/>
  <text class="ui muted small" x="658" y="288">Search titles, logs, and notes…</text>
  <rect x="1102" y="260" width="118" height="48" rx="12" fill="#292331" stroke="#675184"/>
  <text class="ui" x="1161" y="289" text-anchor="middle" fill="#d8bbff" font-size="13" font-weight="700">💼 Work</text>
  <rect x="1230" y="260" width="120" height="48" rx="12" fill="#14161d" stroke="#3b3d4a"/>
  <text class="ui muted" x="1290" y="289" text-anchor="middle" font-size="13" font-weight="650">👤 Personal</text>

  <rect x="610" y="326" width="740" height="40" rx="10" fill="#171920"/>
  <text class="ui muted tiny" x="628" y="351">FILTER BY</text>
  <text class="ui white tiny" x="714" y="351" font-weight="650">Scope: Work</text>
  <circle cx="807" cy="346" r="2" fill="#777a87"/>
  <text class="ui white tiny" x="824" y="351" font-weight="650">Customer: Northstar Labs</text>
  <circle cx="1002" cy="346" r="2" fill="#777a87"/>
  <text class="ui" x="1020" y="351" fill="#d2b4ff" font-size="13" font-weight="650">#roadmap</text>
  <text class="ui muted tiny" x="1327" y="351" text-anchor="end">Clear</text>

  <text class="ui muted tiny" x="628" y="397" font-weight="700" letter-spacing=".8">RECENT RESULTS</text>
  <text class="ui muted tiny" x="1327" y="397" text-anchor="end">SORTED BY DATE</text>

  <rect x="610" y="414" width="740" height="76" rx="12" fill="#20222b" stroke="#373945"/>
  <rect x="628" y="432" width="34" height="34" rx="10" fill="#352944"/><text class="ui" x="645" y="454" text-anchor="middle" fill="#d4b3ff" font-size="17">◷</text>
  <text class="ui white" x="678" y="440" font-size="15" font-weight="700">Atlas roadmap review</text>
