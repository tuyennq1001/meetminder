  <rect x="1098" y="428" width="74" height="23" rx="11.5" fill="#30273e"/><text class="ui" x="1135" y="444" text-anchor="middle" fill="#d7b9ff" font-size="11" font-weight="650">Planning</text>
  <rect x="1180" y="428" width="78" height="23" rx="11.5" fill="#202c3b"/><text class="ui" x="1219" y="444" text-anchor="middle" fill="#b4d4ff" font-size="11" font-weight="650">#roadmap</text>
  <rect x="1266" y="428" width="63" height="23" rx="11.5" fill="#21352f"/><text class="ui" x="1297" y="444" text-anchor="middle" fill="#a8e3c2" font-size="11" font-weight="650">#Q3</text>

  <rect x="610" y="501" width="740" height="76" rx="12" fill="#1c1e27" stroke="#30323d"/>
  <rect x="628" y="519" width="34" height="34" rx="10" fill="#253344"/><text class="ui" x="645" y="541" text-anchor="middle" fill="#b7d4ff" font-size="16">◷</text>
  <text class="ui white" x="678" y="527" font-size="15" font-weight="700">Customer discovery interviews</text>
  <text class="ui muted tiny" x="678" y="550">Yesterday · 2:00 PM · Northstar Labs / Atlas Mobile</text>
  <rect x="1098" y="515" width="74" height="23" rx="11.5" fill="#30273e"/><text class="ui" x="1135" y="531" text-anchor="middle" fill="#d7b9ff" font-size="11" font-weight="650">Research</text>
  <rect x="1180" y="515" width="78" height="23" rx="11.5" fill="#202c3b"/><text class="ui" x="1219" y="531" text-anchor="middle" fill="#b4d4ff" font-size="11" font-weight="650">#research</text>

  <rect x="610" y="588" width="740" height="76" rx="12" fill="#1c1e27" stroke="#30323d"/>
  <rect x="628" y="606" width="34" height="34" rx="10" fill="#253b34"/><text class="ui" x="645" y="628" text-anchor="middle" fill="#a9e2c3" font-size="16">◷</text>
  <text class="ui white" x="678" y="614" font-size="15" font-weight="700">Weekly team sync</text>
  <text class="ui muted tiny" x="678" y="637">Sep 22 · 9:00 AM · Product Team</text>
  <rect x="1098" y="602" width="74" height="23" rx="11.5" fill="#30273e"/><text class="ui" x="1135" y="618" text-anchor="middle" fill="#d7b9ff" font-size="11" font-weight="650">Team Sync</text>
  <rect x="1180" y="602" width="78" height="23" rx="11.5" fill="#21352f"/><text class="ui" x="1219" y="618" text-anchor="middle" fill="#a8e3c2" font-size="11" font-weight="650">#weekly</text>
