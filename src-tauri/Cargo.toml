[package]
name = "meet-minder"
version = "1.0.1"
description = "Meet Minder — real-time speech translation for meetings"
authors = ["Terry <tuyennq1001@gmail.com>"]
edition = "2021"

[lib]
name = "meet_minder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Enabled only for dev builds (via scripts/tauri-with-env.mjs) to expose the WebView
# inspector. Release builds (npm run build / tauri build) never enable this.
devtools = ["tauri/devtools"]

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
chrono = "0.4"
cpal = "0.15"
reqwest = { version = "0.12", features = ["rustls-tls", "stream", "json"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
http = "1"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
tokio = { version = "1", features = ["sync", "rt", "macros", "time", "fs"] }
rubato = "0.16"
# Local offline TTS: Piper (VITS) via sherpa-onnx (static-linked, no dylib bundling).
sherpa-onnx = "1.13.3"
tauri-plugin-dialog = "2"
regex = "1"
# Model archive extraction (.tar.bz2) for downloaded Piper voices.
tar = "0.4"
bzip2 = "0.4"

# macOS: ScreenCaptureKit for system audio
[target.'cfg(target_os = "macos")'.dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
screencapturekit = "1.5"
block2 = "0.6.2"

# Windows: WASAPI for system audio (legacy loopback only)
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_Foundation",
] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.10.0"
tauri-plugin-process = "2"
