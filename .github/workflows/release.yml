name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14  # Apple Silicon runner
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64

      - name: Validate updater signing key
        shell: bash
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not configured in repository secrets."
            exit 1
          fi

      - name: Install Apple Certificate
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "${CERTIFICATE:-}" ]; then
            echo "::error::APPLE_CERTIFICATE is required for notarized macOS releases."
            exit 1
          fi
          if [ -z "${CERTIFICATE_PASSWORD:-}" ]; then
            echo "::error::APPLE_CERTIFICATE_PASSWORD is required."
            exit 1
          fi

          CERT_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$CERTIFICATE" | base64 --decode -o $CERT_PATH

          security create-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH
          security import $CERT_PATH -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH login.keychain

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is required for signed and notarized macOS releases."
              exit 1
            fi
          done
          if [[ "$APPLE_SIGNING_IDENTITY" != Developer\ ID\ Application:* ]]; then
            echo "::error::APPLE_SIGNING_IDENTITY must be a Developer ID Application identity."
            exit 1
          fi
          npm run tauri build -- --config src-tauri/tauri.release.conf.json --config "{\"bundle\":{\"macOS\":{\"signingIdentity\":\"${APPLE_SIGNING_IDENTITY}\"}}}"

      - name: Finalize and verify signed macOS artifacts
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/finalize-macos-release.sh src-tauri/target/release/bundle

      - name: Notarize and verify DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          shopt -s nullglob
          dmgs=(src-tauri/target/release/bundle/dmg/*.dmg)
          if [ ${#dmgs[@]} -eq 0 ]; then
            echo "::error::No macOS DMG was produced."
            exit 1
          fi
          for dmg in "${dmgs[@]}"; do
            xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
            spctl --assess --type open --context context:primary-signature --verbose "$dmg"
          done

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error


  release:
    needs: [build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Download Apple Silicon macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-build
          path: artifacts/macos

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Rename updater archive to include architecture
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            mv "$file" "${file%.app.tar.gz}_aarch64.app.tar.gz"
          done < <(find artifacts/macos -type f -name '*.app.tar.gz' -print0)
          while IFS= read -r -d '' file; do
            mv "$file" "${file%.app.tar.gz.sig}_aarch64.app.tar.gz.sig"
          done < <(find artifacts/macos -type f -name '*.app.tar.gz.sig' -print0)

      - name: Normalize release asset filenames
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            normalized="${file// /.}"
            if [[ "$file" != "$normalized" ]]; then
              mv "$file" "$normalized"
            fi
          done < <(find artifacts -type f -name '* *' -print0)
          find artifacts -type f | sort

      - name: Generate latest.json for Apple Silicon updater
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.VERSION }}"
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          REPO="https://github.com/${{ github.repository }}/releases/download/v${VERSION}"
          UPDATE_FILE=$(find artifacts/macos -type f -name '*_aarch64.app.tar.gz' -print -quit)
          if [ -z "$UPDATE_FILE" ] || [ ! -f "$UPDATE_FILE" ]; then
            echo "::error::Missing Apple Silicon updater archive."
            exit 1
          fi
          if [ ! -s "$UPDATE_FILE.sig" ]; then
            echo "::error::Missing updater signature: $UPDATE_FILE.sig"
            exit 1
          fi
          UPDATE_NAME=$(basename "$UPDATE_FILE")
          jq -n \
            --arg version "$VERSION" \
            --arg notes "See release notes at https://github.com/${{ github.repository }}/releases/tag/v${VERSION}" \
            --arg pub_date "$DATE" \
            --arg repo "$REPO" \
            --arg signature "$(cat "$UPDATE_FILE.sig")" \
            --arg file "$UPDATE_NAME" \
            '{version: $version, notes: $notes, pub_date: $pub_date, platforms: {"darwin-aarch64": {signature: $signature, url: ($repo + "/" + $file)}}}' \
            > artifacts/latest.json
          jq . artifacts/latest.json
          URL_FILE=$(jq -r '.platforms["darwin-aarch64"].url' artifacts/latest.json)
          MATCHED_FILE=$(find artifacts/macos -type f -name "${URL_FILE##*/}" -print -quit)
          if [ -z "$MATCHED_FILE" ]; then
            echo "::error::Updater URL has no matching release asset: $URL_FILE"
            exit 1
          fi

      - name: Extract release notes from changelog
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          CHANGELOG="docs/project-changelog.md"
          OUT="release-notes.md"
          awk -v tag="## v${VERSION}" '
            $0 ~ "^" tag " " || $0 ~ "^" tag "$" { flag=1; next }
            /^## v/ { flag=0 }
            flag { print }
          ' "$CHANGELOG" > "$OUT"
          if [ ! -s "$OUT" ]; then
            echo "Release v${VERSION}" > "$OUT"
            echo "" >> "$OUT"
            echo "See commits: https://github.com/${{ github.repository }}/compare/...v${VERSION}" >> "$OUT"
          fi
          echo "" >> "$OUT"
          echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/...v${VERSION}" >> "$OUT"
          cat "$OUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          body_path: release-notes.md
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.app.tar.gz
            artifacts/**/*.sig
            artifacts/latest.json
